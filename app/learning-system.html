<title>نظام التعلّم للصف الثالث</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: a spiral-bound notebook cover with a name label, on graph paper; six coloured subject dividers below it */
:root{
  --paper:#F2F5FA; --grid:#E2E8F3; --card:#FFFFFF; --ink:#1A2340; --muted:#5A6582; --line:#D9E0ED;
  --cover:#1E2A4A; --on-cover:#F4F7FF; --on-cover-muted:#B7C1DC;
  --label:#FFFFFF; --label-ink:#1A2340; --label-line:#D7DDEA; --label-muted:#6A7490;
  --math:#2F6FEB; --science:#0E9A66; --english:#D93C48; --arabic:#C27005; --islamic:#0A827F; --computer:#7150E6;
  --on-c:#FFFFFF; --ok:#0E9A66; --bad:#D93C48; --star:#F0A500; --focus:#2F6FEB; --scrim:rgba(18,26,48,.5);
  --hl:#FFE14D; --hl-ink:#1A2340;
  --read:"Andika","Segoe UI",system-ui,sans-serif;
  --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1426; --grid:#161E36; --card:#161F37; --ink:#E7ECF8; --muted:#9AA6C3; --line:#28334E;
  --cover:#1D2744; --on-cover:#EEF2FB; --on-cover-muted:#A7B2CE;
  --label:#EEF2F9; --label-ink:#1A2340; --label-line:#CBD3E3; --label-muted:#5E6886;
  --math:#7FA5FF; --science:#43CA95; --english:#FF8088; --arabic:#F2A642; --islamic:#3DC5C0; --computer:#A98FFF;
  --on-c:#0E1426; --ok:#43CA95; --bad:#FF8088; --star:#FFC640; --focus:#7FA5FF; --scrim:rgba(0,0,0,.62);
  --hl:#EBCB2E; --hl-ink:#14182A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1426; --grid:#161E36; --card:#161F37; --ink:#E7ECF8; --muted:#9AA6C3; --line:#28334E;
  --cover:#1D2744; --on-cover:#EEF2FB; --on-cover-muted:#A7B2CE;
  --label:#EEF2F9; --label-ink:#1A2340; --label-line:#CBD3E3; --label-muted:#5E6886;
  --math:#7FA5FF; --science:#43CA95; --english:#FF8088; --arabic:#F2A642; --islamic:#3DC5C0; --computer:#A98FFF;
  --on-c:#0E1426; --ok:#43CA95; --bad:#FF8088; --star:#FFC640; --focus:#7FA5FF; --scrim:rgba(0,0,0,.62);
  --hl:#EBCB2E; --hl-ink:#14182A;
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
body.locked{overflow:hidden}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within>.segopt{outline:3px solid var(--focus);outline-offset:2px}

.s-math{--c:var(--math)}.s-science{--c:var(--science)}.s-english{--c:var(--english)}
.s-arabic{--c:var(--arabic)}.s-islamic{--c:var(--islamic)}.s-computer{--c:var(--computer)}
.s-math,.s-science,.s-english,.s-arabic,.s-islamic,.s-computer{--tint:color-mix(in srgb,var(--c) 12%,var(--card));--tint2:color-mix(in srgb,var(--c) 24%,var(--card))}

.wrap{max-width:1080px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}

/* cover */
.cover{position:relative;background:var(--cover);color:var(--on-cover);border-radius:18px;padding:44px 26px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:end;overflow:hidden}
.cover::before{content:"";position:absolute;top:14px;left:20px;right:20px;height:14px;background:radial-gradient(circle,var(--paper) 0 5px,transparent 5.6px) center/28px 14px repeat-x}
.cover h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,8vw,4rem);line-height:1;margin:0}
.cover .sub{margin:.55rem 0 0;color:var(--on-cover-muted);max-width:46ch}
.label{background:var(--label);color:var(--label-ink);border-radius:8px;padding:10px 16px 12px;min-width:240px;display:grid;gap:0;transform:rotate(-1.2deg);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.label div{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--label-line);padding-block:5px}
.label div:last-child{border-bottom:0}
.label b{font-weight:500;color:var(--label-muted);font-size:.85rem;min-width:4.5em}
.label span{font-family:var(--display);font-weight:700;font-size:1.1rem}
.cover-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.nex{display:inline-flex;align-items:center;gap:8px;background:var(--on-cover);color:var(--cover);border:0;border-radius:12px;padding:10px 16px;font-weight:700;text-decoration:none;cursor:pointer}
.nex svg{width:16px;height:16px}
.btn-cover{background:transparent;color:var(--on-cover);border:1px solid color-mix(in srgb,var(--on-cover) 35%,transparent);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn-cover svg{width:16px;height:16px;vertical-align:-3px}
@media (max-width:640px){.cover{grid-template-columns:1fr;padding-inline:20px}.label{min-width:0;transform:none}}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.color{background:var(--c);color:var(--on-c);border-color:var(--c)}
.btn.small{padding:5px 10px;font-size:.85rem;border-radius:8px}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:var(--card);border-color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.eyebrow{display:block;font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.muted{color:var(--muted)}
.empty{color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:14px 16px;font-size:.93rem;margin:0}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--tint2,var(--line));color:var(--ink)}

/* week */
.week{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:14px}
.week-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;justify-content:space-between}
.week-head h2{font-family:var(--display);font-size:1.6rem;line-height:1.2;margin:0}
.week-actions{display:flex;flex-wrap:wrap;gap:8px}
.reminders{margin:0;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--star) 16%,var(--card));display:grid;gap:2px;list-style:none}
.reminders li::before{content:"• ";color:var(--arabic)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:0 22px}
.note{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline;padding:9px 0;border-top:1px dashed var(--line)}
.note .dot{width:10px;height:10px;border-radius:3px;background:var(--c);align-self:center}
.note b{font-weight:700}
.note p{grid-column:2;margin:0;font-size:.92rem;color:var(--ink);overflow-wrap:anywhere}
.note p.none{color:var(--muted)}
details.old{font-size:.92rem}
details.old summary{cursor:pointer;color:var(--muted);font-weight:600}
details.old ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px}
details.old li{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* subject tiles */
.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.subjects{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:370px){.subjects{grid-template-columns:1fr}}
.tile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:4px;min-height:190px;transition:transform .15s ease,box-shadow .15s ease}
.tile::before{content:"";position:absolute;top:-1px;inset-inline-start:22px;width:70px;height:9px;background:var(--c);border-radius:0 0 7px 7px}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px var(--c)}
.motif{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.25;color:var(--c);unicode-bidi:isolate}
.tname{font-family:var(--display);font-weight:700;font-size:1.4rem;line-height:1.2}
.tsub{color:var(--muted);font-size:.88rem}
.tcounts{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:auto;padding-top:8px}
.tcounts b{color:var(--ink);font-weight:700}
.tnote{font-size:.84rem;background:var(--tint);border-radius:8px;padding:6px 9px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* subject view */
.subj{display:grid;gap:24px}
.subj-head{background:var(--c);color:var(--on-c);border-radius:18px;padding:16px 20px 20px;display:grid;gap:10px}
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.92rem;opacity:.9;justify-self:start}
.back svg{width:16px;height:16px}
.subj-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;justify-content:space-between}
.subj-title{display:flex;align-items:center;gap:14px}
.subj-title .motif{color:var(--on-c);font-size:2.4rem;background:color-mix(in srgb,var(--on-c) 16%,transparent);border-radius:12px;padding:2px 14px}
.subj-title h2{font-family:var(--display);font-size:2rem;line-height:1.1;margin:0}
.subj-title p{margin:0;opacity:.85}
.btn.oncolor{background:var(--on-c);color:var(--c);border-color:var(--on-c)}
.wk{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:12px;padding:12px 16px;display:grid;gap:4px}
.wk p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.wk .row-end{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shelf{display:grid;gap:12px}
.shelf-head{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--c);padding-bottom:6px}
.shelf-head h3{font-family:var(--display);font-size:1.35rem;line-height:1.2;margin:0}
.shelf-head .count{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h4{font-family:var(--display);font-size:1.15rem;line-height:1.3;margin:0;overflow-wrap:anywhere}
.card .meta{font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.game-card{background:var(--tint);border-color:transparent}
.mini-stars{display:inline-flex;gap:1px}
.mini-stars svg{width:15px;height:15px}
.thumb{display:block;width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover;border-radius:10px;background:var(--tint);border:0;padding:0;cursor:zoom-in}
.rows{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.frow h4{margin:0;font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.frow .meta{font-size:.82rem;color:var(--muted)}
.frow .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.ftype{font-size:.7rem;font-weight:700;letter-spacing:.06em;padding:5px 7px;border-radius:7px;background:var(--tint);color:var(--c);min-width:44px;text-align:center}
@media (max-width:560px){.frow{grid-template-columns:auto minmax(0,1fr)}.frow .acts{grid-column:1/-1;justify-content:flex-start}}

/* overlay: player, sheet, viewer */
.overlay{position:fixed;inset:0;z-index:40;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-in{max-width:800px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ptop{display:flex;align-items:center;gap:12px}
.pbar{flex:1;height:12px;border-radius:99px;background:var(--tint2);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .35s ease}
.pcount{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);min-width:4ch;text-align:center}
.ptitle{font-family:var(--display);font-size:1rem;font-weight:600;color:var(--muted);margin:14px 0 0;text-align:center}
.q{font-family:var(--display);font-size:clamp(1.45rem,4.6vw,2.05rem);font-weight:700;line-height:1.4;margin:18px 0 22px;text-align:center;overflow-wrap:anywhere}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choices.tf{max-width:520px;margin:0 auto}
.choice,.mitem{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;font-family:var(--display);font-weight:600;display:grid;place-items:center;overflow-wrap:anywhere;transition:border-color .15s,background .15s}
.choice{font-size:1.35rem;min-height:76px}
.choice:hover,.mitem:hover{border-color:var(--c)}
.choice.ok,.mitem.done{background:color-mix(in srgb,var(--ok) 17%,var(--card));border-color:var(--ok)}
.choice.bad,.mitem.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card));border-color:var(--bad);animation:shake .35s}
.choice[disabled],.mitem[disabled]{cursor:default}
.choice.dim{opacity:.5}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:10px;align-content:start}
.mitem{font-size:1.1rem;min-height:58px}
.mitem.sel{border-color:var(--c);background:var(--tint2)}
.mitem.done{opacity:.8}
.typeform{display:grid;gap:12px;max-width:460px;margin:0 auto}
.pinput{font-family:var(--display);font-weight:700;font-size:1.6rem;padding:12px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:100%;text-align:center}
.pinput:focus{border-color:var(--c);outline:none}
.pfeed{min-height:2.6em;text-align:center;font-family:var(--display);font-size:1.35rem;font-weight:700;margin-top:18px}
.pfeed.ok{color:var(--ok)}.pfeed.bad{color:var(--bad)}
.pfeed small{display:block;font-family:var(--body);font-size:1rem;font-weight:600;color:var(--ink)}
.pnext{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn.big{font-family:var(--display);font-size:1.25rem;padding:12px 28px;border-radius:14px}
.end{text-align:center;display:grid;gap:10px;justify-items:center;margin-top:28px}
.end h2{font-family:var(--display);font-size:2.2rem;margin:0}
.end .big-score{font-family:var(--display);font-size:3.2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.stars{display:flex;gap:8px}
.stars svg{width:64px;height:64px}
.stars .st{animation:pop .45s ease backwards}
.stars .st:nth-child(2){animation-delay:.12s}.stars .st:nth-child(3){animation-delay:.24s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

.paper{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:26px 24px 22px;margin-top:14px;box-shadow:0 14px 34px -24px rgba(0,0,0,.45)}
.paper header{display:grid;gap:6px;border-bottom:2px solid var(--c);padding-bottom:12px;margin-bottom:8px}
.paper h2{font-family:var(--display);font-size:1.7rem;line-height:1.2;margin:0}
.paper .namefield{display:flex;flex-wrap:wrap;gap:6px 26px;color:var(--muted);font-size:.92rem}
.paper .namefield span::after{content:"";display:inline-block;width:9em;border-bottom:1px solid var(--muted);margin-inline-start:6px}
.paper .intro{margin:0}
.paper section h3{font-family:var(--display);font-size:1.2rem;margin:18px 0 8px;color:var(--c)}
.paper ol{margin:0;padding-inline-start:1.6em;display:grid;gap:14px}
.paper li{padding-inline-start:4px}
.paper li .qt{display:block;font-weight:500;overflow-wrap:anywhere}
.sline{border:0;border-bottom:2px dotted var(--muted);background:transparent;padding:4px 4px;min-width:10ch;width:min(100%,22ch);color:var(--ink);font-weight:600}
.sline:focus{outline:none;border-bottom-color:var(--c)}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px}
.opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.paper li.ok .qt::after{content:"  ✓";color:var(--ok);font-weight:700}
.paper li.bad .qt::after{content:"  ✗";color:var(--bad);font-weight:700}
.corr{display:block;color:var(--bad);font-size:.9rem;font-weight:600}
.paper footer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.sscore{font-family:var(--display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
/* tutor help: hint, why a wrong answer is wrong, the explanation */
.tutor{margin:12px auto 0;max-width:560px;text-align:start;background:var(--card);background:color-mix(in srgb,var(--star) 11%,var(--card));border:2px solid var(--star);border-color:color-mix(in srgb,var(--star) 55%,var(--line));border-radius:16px;padding:10px 14px;display:grid;gap:8px;font-family:var(--body);font-size:1.05rem;font-weight:600;color:var(--ink);line-height:1.55}
.tutor p{margin:0}
.tutor .tline,.tutor .twhy{display:flex;align-items:flex-start;gap:6px}
.tutor .tline>span:not(.tico),.tutor .twhy>span{flex:1;min-width:0}
.tutor .spk{width:30px;height:30px;margin-top:-2px}
.tutor .spk svg{width:15px;height:15px}
.tutor .tans b{color:var(--ok)}
.tutor .twhy>b{color:var(--c);margin-inline-end:4px}
.tutor .tpic .vcardx{margin:0 auto;max-width:440px}
.shelp .tutor{margin:8px 0 0;max-width:none;font-size:.98rem}
.hintbtn{all:unset;cursor:pointer;display:inline-block;font-size:.85rem;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:2px 10px;margin:4px 0 2px}
.hintbtn:hover,.hintbtn:focus-visible{color:var(--ink);border-color:var(--star)}
.paper li.todo .qt::after{content:"  ✎";color:var(--muted);font-weight:700}
.paper li.todo .corr{color:var(--muted)}
.paper li.bad .sline{border-bottom-color:var(--bad)}
.fixtag{display:inline-block;background:var(--star);color:#1A2340;border-radius:999px;padding:1px 10px;font-size:.85em;margin-inline-end:4px}
.fixintro p{max-width:440px;margin:0;font-size:1.1rem}
.fixicon{font-size:3rem;line-height:1}
.fixdone{margin:4px 0 0;font-weight:700;color:var(--c)}

.demo-note{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 10px;background:var(--star);color:#1A2340;border-radius:10px;padding:6px 12px;font-size:.88rem;font-weight:700}
.demo-note a{color:inherit;display:inline-flex;align-items:center;gap:4px}
.demo-note svg{width:14px;height:14px}
.lbledit{all:unset;cursor:pointer;margin-inline-start:auto;font-size:.75rem;font-weight:700;color:var(--label-muted);border:1px dashed var(--label-line);border-radius:99px;padding:0 8px}
.lbledit:hover,.lbledit:focus-visible{color:var(--label-ink);border-color:var(--label-ink)}
/* reading voice picker */
.vh{font-family:var(--display);font-size:1.05rem;margin:4px 0 0}
.vlistp{display:grid;gap:6px}
.vopt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:6px 10px;cursor:pointer}
.vopt:has(input:checked){border-color:var(--math);background:color-mix(in srgb,var(--math) 8%,var(--card))}
.vopt input{margin:0;accent-color:var(--math)}
.vname{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-weight:700;text-align:start;overflow-wrap:anywhere}
.vname small{font-weight:600;color:var(--muted);font-size:.75rem}
.vname .vnat{color:var(--ok)}
.vopt .spk{width:34px;height:34px}
.vtip{background:color-mix(in srgb,var(--star) 14%,var(--card));border-radius:10px;padding:8px 12px;font-size:.9rem}

/* times tables trainer */
.ttbanner{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 18px;align-items:center;background:var(--card);border:1px solid var(--line);border-inline-start:8px solid var(--c);border-radius:18px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease}
.ttbanner:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px var(--c)}
.ttx{font-family:var(--read);font-weight:700;font-size:3rem;line-height:1;color:var(--on-c);background:var(--c);border-radius:18px;width:76px;height:76px;display:grid;place-items:center}
.ttbody{display:grid;gap:2px;min-width:0}
.ttbody b{font-family:var(--display);font-size:1.45rem;line-height:1.2}
.ttbody .muted{font-size:.92rem}
.ttbadges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;justify-content:flex-start}
.ttbadge{font-family:var(--read);font-weight:700;font-size:.95rem;border-radius:99px;padding:2px 10px;background:var(--tint);border:1px solid var(--tint2);white-space:nowrap}
.ttbadge small{font-weight:600;color:var(--muted);font-size:.75rem}
.ttbadge.full{background:var(--c);color:var(--on-c);border-color:var(--c)}
@media (max-width:560px){.ttbanner{grid-template-columns:auto minmax(0,1fr)}.ttbanner>.btn{grid-column:1/-1}}
.ttgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:10px}
.ttcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:10px 12px 12px;display:grid;gap:6px;justify-items:center;text-align:center}
.ttcard:hover{border-color:var(--c)}
.ttcard .big{font-family:var(--read);font-weight:700;font-size:2rem;line-height:1.1;color:var(--c)}
.ttcard .muted{font-size:.82rem}
.ttbar{width:100%;height:8px;border-radius:99px;background:var(--tint2);overflow:hidden}
.ttbar span{display:block;height:100%;background:var(--ok);border-radius:99px}
.ttsel{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.ttchip{all:unset;box-sizing:border-box;cursor:pointer;border:2px solid var(--line);background:var(--card);border-radius:99px;padding:3px 14px;font-weight:700;font-family:var(--read)}
.ttchip.on{background:var(--c);color:var(--on-c);border-color:var(--c)}
.tteq{display:flex;justify-content:center;align-items:center;gap:clamp(8px,3vw,16px);font-family:var(--read);font-weight:700;font-size:clamp(2.4rem,11vw,3.6rem);line-height:1.2;margin:16px 0 6px;font-variant-numeric:tabular-nums}
.tteq .op{color:var(--muted)}
.kans{min-width:1.7em;padding:0 10px;border-bottom:5px solid var(--c);text-align:center;color:var(--ink)}
.kans.empty{color:var(--muted)}
.kans.ok{color:var(--ok);border-bottom-color:var(--ok)}
.kans.fix{color:var(--bad);border-bottom-color:var(--bad)}
.kpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:330px;margin:14px auto 0}
.kkey{all:unset;box-sizing:border-box;cursor:pointer;height:62px;border-radius:16px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--read);font-weight:700;font-size:1.8rem;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.kkey:hover{border-color:var(--c)}
.kkey:active{background:var(--tint2)}
.kkey.ok{background:var(--c);color:var(--on-c);border-color:var(--c)}
.ttfacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.ttfact{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-family:var(--read);font-weight:700;font-size:1.3rem;text-align:center;font-variant-numeric:tabular-nums}
.ttfact .p{color:var(--c);display:inline-block;min-width:1.6em;border-radius:6px}
.ttfact.mast{border-color:var(--ok)}
.ttfact.now{border-color:var(--c);background:var(--tint)}
.hideans .ttfact:not(.now) .p{color:transparent;background:var(--tint2)}
.ttshow:empty{display:none}
.ttline{margin:6px auto 0;max-width:520px;min-height:40px}
.ttseq{font-family:var(--read);font-weight:700;font-size:1.2rem;margin:0;color:var(--c);text-align:center}
.choices.ttch{grid-template-columns:repeat(3,minmax(0,1fr));max-width:520px;margin:0 auto}
.memgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:520px;margin:14px auto 0}
@media (max-width:420px){.memgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;text-align:center;font-family:var(--read);font-weight:700;font-size:clamp(1.05rem,4.5vw,1.45rem);background:var(--c);color:var(--on-c);border:2px solid var(--c);touch-action:manipulation}
.mcard .back{font-size:1.8rem;opacity:.75}
.mcard.up{background:var(--card);color:var(--ink)}
.mcard.up.fact{background:var(--tint)}
.mcard.done{background:color-mix(in srgb,var(--ok) 15%,var(--card));color:var(--ink);border-color:var(--ok);cursor:default}
.ttstat{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:12px;font-weight:700;font-size:1.2rem}
.ttclock{font-family:var(--read);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums;color:var(--c);min-width:2.2ch;text-align:center;border:3px solid var(--c);border-radius:99px;padding:0 12px}
.ttgot{color:var(--ok)}
.ttmiss{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ttmiss li{background:var(--tint);border-radius:99px;padding:3px 12px;font-family:var(--read);font-weight:700;direction:ltr}
.ttpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.ttpk{position:relative;display:block}
.ttpk input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ttpk span{display:block;text-align:center;border:2px solid var(--line);border-radius:12px;padding:8px 0;font-family:var(--read);font-weight:700;font-size:1.15rem}
.ttpk input:checked+span{background:var(--math);color:var(--on-c);border-color:var(--math)}
.ttpk input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}

.viewer{display:grid;gap:12px;justify-items:center}
.viewer img{max-width:100%;max-height:calc(100vh - 170px);border-radius:8px;background:var(--card)}
.viewer .vnav{display:flex;gap:10px;align-items:center}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.mbox{background:var(--card);color:var(--ink);border-radius:16px;width:100%;max-width:540px;max-height:100%;overflow:auto;padding:20px;display:grid;gap:14px}
.mbox h2{font-family:var(--display);font-size:1.45rem;margin:0}
.mbox p{margin:0}
.field{display:grid;gap:4px;font-weight:600;font-size:.92rem}
.in{font-weight:400;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
textarea.in{min-height:7em;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:8px;border:0;padding:0;margin:0}
.seg legend{font-weight:600;font-size:.92rem;margin-bottom:4px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.segopt{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:99px;font-weight:600;font-size:.92rem}
.seg input:checked+.segopt{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.hint{font-size:.84rem;color:var(--muted)}
.mactions{display:flex;flex-wrap:wrap;gap:8px}
.status{font-size:.9rem;min-height:1.4em}
.status.err{color:var(--bad)}
.busy{display:grid;gap:12px;justify-items:center;text-align:center;padding:10px 0}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--math);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}

/* lesson table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table.lessons{width:100%;border-collapse:collapse;font-size:.92rem}
table.lessons th{text-align:start;font-weight:600;font-size:.8rem;color:var(--muted);background:var(--tint);padding:10px 12px;white-space:nowrap}
table.lessons td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
table.lessons td.per{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
table.lessons td.per .btn{display:flex;margin-top:4px;padding:2px 6px}
table.lessons td.lesson{min-width:200px}
table.lessons .lt{display:block;font-weight:600;overflow-wrap:anywhere}
table.lessons .pg{display:block;color:var(--muted);font-size:.84rem}
table.lessons td.hwcell{min-width:180px}
.hwl{display:block;overflow-wrap:anywhere}
.hwl+.hwl{margin-top:4px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:6px;margin-inline-end:5px}
.tag.hw{background:var(--tint2);color:var(--ink)}
.tag.as{background:color-mix(in srgb,var(--star) 32%,var(--card));color:var(--ink)}
.cellacts{display:flex;flex-wrap:wrap;gap:4px}
table.lessons td.st{white-space:nowrap}
.table-foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.table-foot .hint{margin:0;max-width:70ch}
table.lessons tr.grp td{background:var(--tint2);font-family:var(--display);font-size:1.08rem;padding:8px 12px;border-top:2px solid var(--c)}
table.lessons tr.grp .count{color:var(--muted);font-size:.85rem;font-weight:600;font-family:var(--body)}
table.lessons.older td.per{color:var(--muted);font-size:.85rem}
.olderown{margin-top:6px}
@media (max-width:700px){table.lessons tr.grp{display:block;background:transparent;border:0;padding:0;margin:16px 0 6px}table.lessons tr.grp td{display:block;border-radius:10px}}
@media (max-width:700px){
  .tablewrap{border:0;background:transparent;overflow:visible;border-radius:0}
  table.lessons,table.lessons tbody,table.lessons tr,table.lessons td{display:block;width:100%}
  table.lessons thead{display:none}
  table.lessons tr{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:6px 2px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  table.lessons td{border:0;padding:6px 12px;min-width:0}
  table.lessons td.per,table.lessons td.lesson,table.lessons td.hwcell,table.lessons td.photos,table.lessons td.read{grid-column:1/-1}
  table.lessons td.per{display:flex;justify-content:space-between;align-items:center}
  table.lessons td.per .btn{margin:0}
  table.lessons td.st::before,table.lessons td.photos::before{content:attr(data-label);display:block;font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:2px}
  table.lessons td.st{white-space:normal}
}

/* lesson map */
.omap{display:grid;gap:14px;margin-top:14px}
.ocenter{background:var(--c);color:var(--on-c);border-radius:18px;padding:18px 22px;text-align:center;display:grid;gap:4px;justify-items:center}
.ocenter .eyebrow{color:inherit;opacity:.85}
.ocenter h2{font-family:var(--display);font-size:clamp(1.5rem,4.5vw,2.1rem);line-height:1.2;margin:0}
.ocenter p{margin:0;max-width:52ch}
.obranches{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.obranch{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:14px;padding:12px 16px;min-width:0}
.obranch h3{font-family:var(--display);font-size:1.15rem;line-height:1.3;margin:0 0 6px}
.obranch ul,.orem ul{margin:0;padding-inline-start:1.2em;display:grid;gap:4px}
.owords,.orem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.owords h3,.orem h3{font-family:var(--display);font-size:1.1rem;margin:0 0 8px}
.owords table{width:100%;border-collapse:collapse}
.owords th{text-align:start;font-size:.8rem;color:var(--muted);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--line)}
.owords td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.owords td:first-child{font-weight:700;color:var(--c)}
.orem{background:color-mix(in srgb,var(--star) 14%,var(--card));border-color:transparent}

/* read aloud + vocabulary */
.rtitle{font-family:var(--display);font-size:clamp(1.5rem,4.5vw,2.1rem);line-height:1.2;margin:16px 0 4px}
.rbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);padding-block:10px}
.rhint{margin:0;color:var(--muted);font-size:.92rem}
.reading{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-top:12px;font-family:var(--read);font-size:1.3rem;line-height:1.95}
.reading p{margin:0 0 .9em}
.reading p:last-child{margin-bottom:0}
.sent{cursor:pointer;border-radius:6px;padding:2px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .15s}
.sent:hover{background:var(--tint)}
.sent.now{background:var(--tint2)}
mark.vw{background:var(--hl);color:var(--hl-ink);border-radius:4px;padding:0 3px;cursor:pointer;font-weight:700}
.vb{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 2px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:8px;align-content:start;min-width:0}
.mbox .vcard{border:0;padding:0}
.vhead{display:flex;gap:12px;align-items:center}
.vword{font-family:var(--read);font-size:2rem;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.vpos{font-size:.8rem;color:var(--muted);font-weight:600}
.vmean{font-size:1.12rem;margin:0}
.var{color:var(--muted);margin:0}
.vsec{font-size:.76rem;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:6px 0 0}
.vex{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.vex li{display:flex;gap:8px;align-items:flex-start;font-family:var(--read);font-size:1.08rem;line-height:1.5}
.spk{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--tint2);color:var(--ink)}
.spk svg{width:18px;height:18px}
.spk.big{width:84px;height:84px;background:var(--c);color:var(--on-c)}
.spk.big svg{width:40px;height:40px}
.spk-off{display:inline-grid;place-items:center;width:30px;height:30px;color:var(--line)}
.spk-off svg{width:18px;height:18px}
.yours{display:grid;gap:6px}
.yours .btn{justify-self:start}
.vfeed{margin:0;font-size:.98rem;overflow-wrap:anywhere}
.vfeed.ok{color:var(--ok)}.vfeed.bad{color:var(--bad)}
.vfeed .better{display:block;color:var(--ink);font-family:var(--read)}
.listen-wrap{display:grid;justify-items:center;margin-bottom:16px}

/* dictation trainer */
.dt-head{display:grid;gap:4px;margin-top:14px}
.dt-head h2{font-family:var(--display);font-size:clamp(1.5rem,4.5vw,2rem);line-height:1.2;margin:0}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.gw{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 6px 8px;display:grid;justify-items:center;gap:2px;text-align:center;min-width:0}
.gw svg{width:34px;height:36px}
.gw b{font-family:var(--dfont,var(--read));font-size:1.05rem;overflow-wrap:anywhere}
.gw.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.steps{display:grid;gap:10px;margin-top:18px}
.step{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.step:hover{border-color:var(--c)}
.step .num{grid-row:span 2;width:42px;height:42px;border-radius:50%;background:var(--tint2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--ink)}
.step b{font-family:var(--display);font-size:1.15rem;line-height:1.3}
.step .sub{color:var(--muted);font-size:.9rem}
.bigword{font-family:var(--dfont,var(--read));font-weight:700;font-size:clamp(2.6rem,11vw,4.2rem);line-height:1.3;text-align:center;letter-spacing:.03em;margin:16px 0 6px;overflow-wrap:anywhere}
.ghost{color:var(--muted);opacity:.5;border-bottom:3px dashed var(--muted)}
.dnote{text-align:center;color:var(--muted);margin:0 auto 10px;max-width:46ch}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0}
.tile-l{all:unset;box-sizing:border-box;cursor:pointer;min-width:54px;height:58px;padding:0 12px;border-radius:12px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--dfont,var(--read));font-weight:700;font-size:1.6rem}
.tile-l:hover{border-color:var(--c)}
.tile-l.used{opacity:.25;cursor:default}
.tile-l.found{background:var(--tint2);border-color:var(--c)}
.tile-l.bad{border-color:var(--bad);animation:shake .35s}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:60px;margin-top:6px}
.slot{min-width:44px;height:54px;padding:0 6px;border-bottom:3px solid var(--line);display:grid;place-items:center;font-family:var(--dfont,var(--read));font-weight:700;font-size:1.6rem}
.diff{display:flex;justify-content:center;flex-wrap:wrap;font-family:var(--dfont,var(--read));font-size:2rem;font-weight:700;margin-top:10px}
.diff .ok{color:var(--ok)}.diff .no{color:var(--bad);text-decoration:underline}
.cover-bar{height:8px;border-radius:99px;background:var(--tint2);overflow:hidden;max-width:320px;margin:0 auto 10px}
.cover-bar span{display:block;height:100%;background:var(--c);animation:drain 4s linear forwards}
@keyframes drain{from{width:100%}to{width:0}}
.arsent{font-family:var(--display);font-size:clamp(1.6rem,6vw,2.3rem);line-height:2.1;text-align:center;margin:14px 0}
.arw{all:unset;cursor:pointer;padding:0 4px;border-radius:8px;border-bottom:3px solid transparent}
.arw.rule{border-bottom-color:var(--c)}
.arw.now{background:var(--tint2)}

const ETYPES=['reading','grammar','phonics','writing','other'];

const ETYPE_EN={reading:'Reading',grammar:'Grammar',phonics:'Phonics',writing:'Writing',other:'Other'};
function etype(l){
  if(!l||l.subject!=='english')return '';
  if(ETYPES.includes(l.etype))return l.etype;
  const t=String(l.title||'');
  if(/grammar/i.test(t))return 'grammar';
  if(/phonics|spelling|silent letter|digraph|blend|vowel/i.test(t))return 'phonics';
  if(/reading/i.test(t))return 'reading';
  if(/writing/i.test(t))return 'writing';
  return 'reading';
}
const needsReading=l=>etype(l)==='reading'&&l.reading!==false;
/* Math and English grammar/phonics get a picture guide (diagrams) instead of a text-only map. */
function kindsFor(l){
  if(l&&l.subject==='math')return ['visual','sheet','game'];
  const e=etype(l);
  if(e==='reading')return l.reading===false?MAKE_KINDS:['reading','outline','sheet','game'];
  if(e==='grammar')return ['grammar','visual','sheet','game'];
  if(e==='phonics')return ['phonics','visual','sheet','game'];
  return MAKE_KINDS;
}

  c.use('downloads').then(d=>{S.downloads=d;renderAll()}).catch(()=>{});

}
function subErr(){S.loaded=true;renderAll()}
function subscribe(){
  const db=S.db;
  db.collection('items').onSnapshot(snap=>{
    S.items=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
    S.loaded=true;renderAll();
  },subErr);
  db.collection('weeks').onSnapshot(snap=>{
    S.weeks=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>String(b.weekOf||'').localeCompare(String(a.weekOf||''))||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
    renderAll();
  },subErr);
  db.collection('lessons').onSnapshot(snap=>{
    S.lessons=snap.docs.map(d=>Object.assign({id:d.id},d.data()));renderAll();
  },()=>{});
  db.doc('settings/main').onSnapshot(d=>{S.settings=d.exists?d.data():{};renderNex()},()=>{});
  db.collection('results').onSnapshot(snap=>{
    const r={};snap.docs.forEach(d=>{r[d.id]=d.data()});S.results=r;renderAll();
  },()=>{});
}

function shelf(title,count,body,empty){
  return `<section class="shelf"><div class="shelf-head"><h3>${title}</h3><span class="count">${count}</span></div>${count?body:`<p class="empty">${empty}</p>`}</section>`;
}
function bestStars(pct){return pct>=90?3:pct>=70?2:pct>=40?1:0}
function delBtn(id){return canEditData()?`<button class="btn small quiet danger" data-act="del" data-id="${esc(id)}">${tx('حذف','Delete')}</button>`:''}

const mapHead=sid=>sid==='math'?tx('الشرح المصوّر','Picture guide'):sid==='english'?tx('المخطط أو الرسوم','Map or pictures'):tx('مخطط','Map');
function tableHtml(s,ls,free){
  const first=free?tx('الوحدة','Unit'):tx('الحصة','Period');

function tableHint(){
  return canMake()?tx('لكل درس تُرفع صور صفحاته، ثم يجهّز زر «اصنع» المخطط وورقة التدريب واللعبة. ويمكن أيضاً إرسال الصور إلى Claude في المحادثة.','For each lesson, upload photos of its pages, then “Make” prepares the map, practice sheet and game. You can also send the photos to Claude in the chat.')
    :tx('لكل درس تُرفع صور صفحاته، ثم تُرسل إلى Claude في المحادثة ليجهّز المخطط وورقة التدريب واللعبة.','For each lesson, upload photos of its pages, then send them to Claude in the chat to prepare the map, practice sheet and game.');
}
function lessonTable(s){
  const ls=lessonsFor(s.id);const w=curWeek();
  const addBtn=(w&&canEditData())?`<button class="btn small" data-act="lessonform" data-subject="${s.id}">${tx('إضافة درس','Add a lesson')}</button>`:'';
  const head=`<div class="shelf-head"><h3>${tx('دروس هذا الأسبوع','This week’s lessons')}</h3><span class="count">${ls.length}</span></div>`;
  if(!ls.length){
    return `<section class="shelf">${head}<p class="empty">${w?tx('لم تُوزَّع دروس هذا الأسبوع على الجدول بعد.','This week’s lessons are not in the table yet.'):tx('لم تُرفع خطة هذا الأسبوع بعد.','No plan for this week yet.')}</p>${addBtn?`<div>${addBtn}</div>`:''}</section>`;
  }
  return `<section class="shelf">${head}${tableHtml(s,ls,false)}
    <div class="table-foot"><p class="hint">${tableHint()}</p>${addBtn}</div></section>`;
}
/* Older lessons: every lesson that is not in this week's plan (past weeks and lessons added without a plan),
   newest first, in one table with only what helps revision: the explanation, the map, the sheet and the game.
   English is split into reading, grammar, and phonics with dictation. */
function olderLessons(sid){
  const w=curWeek();
  const dateOf=l=>{const x=S.weeks.find(y=>y.id===l.week);return str(x&&x.weekOf)||str(l.weekOf)};
  /* Plan weeks first, newest week on top; lessons added without a plan (usually older) after them, in their own order. */
  return S.lessons.filter(l=>l.subject===sid&&!(w&&l.week===w.id))
    .sort((a,b)=>{const fa=!a.week,fb=!b.week;if(fa!==fb)return fa?1:-1;
      return (fa?0:dateOf(b).localeCompare(dateOf(a)))||(a.week===b.week?0:String(a.week).localeCompare(String(b.week)))||(a.order||0)-(b.order||0)});
}
function whenLabel(l){
  if(l.week){const x=S.weeks.find(y=>y.id===l.week);const t=x?weekTitle(x):'';return t.split('·')[0].trim()||fmtDay(l.weekOf)||'—'}
  return perLabel(l.period)||'—';
}
const egroup=l=>{const e=etype(l);if(e==='grammar')return 'grammar';if(e==='phonics'||dictOf(l))return 'phonics';return 'reading'};
function olderTable(s,ls){
  const en=s.id==='english',cols=en?6:5;
  const head=`<thead><tr><th>${tx('الأسبوع','Week')}</th><th>${tx('الدرس','Lesson')}</th>${en?`<th>${tx('الشرح','Explanation')}</th>`:''}<th>${mapHead(s.id)}</th><th>${tx('ورقة تدريب','Sheet')}</th><th>${tx('لعبة','Game')}</th></tr></thead>`;
  const row=l=>lessonRow(l,tx('الأسبوع','Week'),0,1,{older:true,when:whenLabel(l)});
  let body='';
  if(en){
    [['reading',tx('القراءة','Reading')],['grammar',tx('القواعد · Grammar','Grammar')],['phonics',tx('الفونكس والإملاء','Phonics and dictation')]].forEach(([g,label])=>{
      const part=ls.filter(l=>egroup(l)===g);if(!part.length)return;
      body+=`<tr class="grp"><td colspan="${cols}"><b>${label}</b> <span class="count">${part.length}</span></td></tr>`+part.map(row).join('');
    });
  }else body=ls.map(row).join('');
  return `<div class="tablewrap"><table class="lessons older">${head}<tbody>${body}</tbody></table></div>`;
}
function olderSection(s){
  const ls=olderLessons(s.id),n=ls.length;
  const add=canEditData()?`<button class="btn small color" data-act="oldform" data-subject="${s.id}">${ICON.plus} ${tx('إضافة درس سابق','Add an older lesson')}</button>`:'';
  let body=n?olderTable(s,ls):'';
  if(!n)body=`<p class="empty">${tx('هنا تُحفظ الدروس السابقة، أو أي درس يُضاف بلا خطة أسبوعية. تعمل بالطريقة نفسها: صور الدرس، ثم المخطط والورقة واللعبة.','Older lessons, or any lesson added without a weekly plan, live here. They work the same way: lesson photos, then the map, sheet and game.')}</p>`;
  return `<section class="shelf olderwrap"><div class="shelf-head"><h3>${tx('الدروس السابقة','Older lessons')}</h3><span class="count">${n}</span><span style="flex:1"></span>${add}</div>${body}</section>`;
}
function lessonRow(l,first,k,total,opts){
  const imgs=lessonImages(l.id);
  const pages=str(l.pages),hw=str(l.homework),as=str(l.assess);
  let photo='';
  if(imgs.length){
    photo=`<button class="btn small" data-act="lview" data-id="${esc(l.id)}">${tx('عرض','View')} (${imgs.length})</button>`+(canUpload()?`<button class="btn small quiet" data-act="lupload" data-id="${esc(l.id)}">${tx('إضافة صور','Add photos')}</button>`:'');
  }else photo=canUpload()?`<button class="btn small color" data-act="lupload" data-id="${esc(l.id)}">${tx('رفع صور','Upload photos')}</button>`:'<span class="muted">—</span>';
  const kinds=kindsFor(l);
  const missing=kinds.filter(k=>!lessonItems(l.id,k).length);
  if(imgs.length&&canMake()&&missing.length>1)photo+=`<button class="btn small" data-act="lmake" data-what="${missing.join(',')}" data-id="${esc(l.id)}">${missing.length===kinds.length?tx('اصنع الكل','Make all'):tx('اصنع الباقي','Make the rest')}</button>`;
  if(lessonStale(l))photo+=canMake()?`<button class="btn small color" data-act="lrefresh" data-id="${esc(l.id)}">${tx('تحديث من كل الصور','Update from all photos')}</button>`
    :`<span class="pg">${tx('أُضيفت صور جديدة بعد التجهيز.','New photos were added after preparing.')}</span>`;
  const readCell=()=>{
    const it=lessonItems(l.id,'reading')[0];
    if(it)return `<div class="cellacts"><button class="btn small color" data-act="open" data-id="${esc(it.id)}">${ICON.speaker} ${tx('اسمعي','Listen')}</button>${(it.vocab||[]).length?`<button class="btn small" data-act="vocab" data-id="${esc(it.id)}">${tx('الكلمات','Words')} (${it.vocab.length})</button>`:''}</div>`;
    if(imgs.length&&canMake())return `<button class="btn small" data-act="lmake" data-what="reading" data-id="${esc(l.id)}">${ICON.speaker} ${tx('جهّزي القراءة','Prepare reading')}</button>`;
    if(!S.db)return '<span class="muted">—</span>';
    return `<button class="btn small quiet" data-act="noread" data-id="${esc(l.id)}" aria-label="${tx('القراءة غير جاهزة','Reading not ready')}">${ICON.speaker}</button>`;
  };
  const cell=(kind,label)=>{
    const it=lessonItems(l.id,kind)[0];
    if(it)return `<button class="btn small color" data-act="open" data-id="${esc(it.id)}">${label}</button>`;
    if(imgs.length&&canMake()&&kinds.includes(kind))return `<button class="btn small" data-act="lmake" data-what="${kind}" data-id="${esc(l.id)}">${tx('اصنع','Make')}</button>`;
    return '<span class="muted">—</span>';
  };
  const mapCell=()=>{
    if(!kinds.includes('visual'))return cell('outline',tx('افتح','Open'));
    const v=lessonItems(l.id,'visual')[0];
    if(v)return `<button class="btn small color" data-act="open" data-id="${esc(v.id)}">${tx('الرسوم','Pictures')}</button>`;
    if(imgs.length&&canMake())return `<button class="btn small" data-act="lmake" data-what="visual" data-id="${esc(l.id)}">${tx('اصنع','Make')}</button>`;
    const o=lessonItems(l.id,'outline')[0];
    return o?`<button class="btn small" data-act="open" data-id="${esc(o.id)}">${tx('افتح','Open')}</button>`:'<span class="muted">—</span>';
  };
  const et=etype(l);
  const explainCell=()=>{
    if(et==='reading')return readCell();
    if(et==='grammar')return cell('grammar',tx('القاعدة','Rule'));
    if(et==='phonics')return cell('phonics',tx('الكلمات والقواعد','Words & rules'));
    return '<span class="muted">—</span>';
  };
  const asTag=str(l.assessType)||(/إملاء|dictation/i.test(as)?'إملاء':/project|مشروع/i.test(as)?'مشروع':'تقييم');
  const tools=canEditData()?`<span class="rowtools"><button class="btn small quiet" data-act="ledit" data-id="${esc(l.id)}">${tx('تعديل','Edit')}</button><button class="btn small quiet" data-act="lmove" data-dir="up" data-id="${esc(l.id)}" ${k===0?'disabled':''} aria-label="${tx('نقل للأعلى','Move up')}">↑</button><button class="btn small quiet" data-act="lmove" data-dir="down" data-id="${esc(l.id)}" ${k===total-1?'disabled':''} aria-label="${tx('نقل للأسفل','Move down')}">↓</button><button class="btn small quiet danger" data-act="dellesson" data-id="${esc(l.id)}">${tx('حذف','Delete')}</button></span>`:'';
  if(opts&&opts.older){
    const dictBtn=dictOf(l)?`<button class="btn small color" data-act="dict" data-id="${esc(l.id)}">${tx('مدرّب الإملاء','Dictation trainer')}</button>`:'';
    const toolsO=canEditData()?`<span class="rowtools"><button class="btn small quiet" data-act="ledit" data-id="${esc(l.id)}">${tx('تعديل','Edit')}</button><button class="btn small quiet danger" data-act="dellesson" data-id="${esc(l.id)}">${tx('حذف','Delete')}</button></span>`:'';
    const own=canUpload()?`<div class="cellacts olderown">${photo}</div>`:'';
    let ex='';
    if(l.subject==='english'){const e=explainCell();ex=`<td class="st read" data-label="${tx('الشرح','Explanation')}"><div class="cellacts">${dictBtn&&/class="muted"/.test(e)?dictBtn:e+dictBtn}</div></td>`}
    const dictIn=l.subject!=='english'&&dictBtn?`<div class="cellacts olderown">${dictBtn}</div>`:'';
    return `<tr>

    <td class="st" data-label="${tx('ورقة تدريب','Sheet')}">${cell('sheet',tx('افتح','Open'))}</td>
    <td class="st" data-label="${tx('لعبة','Game')}">${cell('game',tx('العبي','Play'))}</td></tr>`;
  }
  return `<tr>
    <td class="per" data-label="${first}"><span dir="auto">${esc(perLabel(l.period))||'—'}</span></td>
    <td class="lesson" data-label="${tx('الدرس','Lesson')}"><span class="lt" dir="auto">${esc(l.title)}</span>${pages?`<span class="pg">${tx('ص','p.')} ${esc(pages)}</span>`:''}${et?`<span class="etag">${esc(tx(ETYPE_AR[et],ETYPE_EN[et]))}</span>`:''}${tools}</td>
    <td class="hwcell" data-label="${tx('الواجب والتقييم','Homework and tests')}">${hw?`<span class="hwl"><span class="tag hw">${tagLabel('واجب')}</span><span dir="auto">${esc(hw)}</span></span>`:''}${as?`<span class="hwl"><span class="tag as">${esc(tagLabel(asTag))}</span><span dir="auto">${esc(as)}</span></span>`:''}${dictOf(l)?`<button class="btn small color" style="margin-top:6px" data-act="dict" data-id="${esc(l.id)}">${tx('تدرّبي على الإملاء','Practise dictation')}</button>`:''}${!hw&&!as?'<span class="muted">—</span>':''}</td>
    <td class="photos" data-label="${tx('صور الدرس','Lesson photos')}"><div class="cellacts">${photo}</div></td>
    ${l.subject==='english'?`<td class="st read" data-label="${tx('الشرح','Explanation')}">${explainCell()}</td>`:''}

}

/* ---------- files ---------- */
const IMG_TYPES=['image/jpeg','image/png','image/webp','image/gif'];
async function prepFile(file){
  const t=String(file.type||'').toLowerCase();const n=String(file.name||'').toLowerCase();
  if(t==='application/pdf'||n.endsWith('.pdf'))return{blob:file,type:'application/pdf'};
  if(t.startsWith('image/')||/\.(jpe?g|png|webp|gif|heic|heif)$/.test(n)){
    try{
      const bmp=await createImageBitmap(file);
      const max=2000,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
      const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(bmp,0,0,cv.width,cv.height);
      const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.86));
      if(b&&b.size)return{blob:b,type:'image/jpeg'};
    }catch(e){}
    if(IMG_TYPES.includes(t))return{blob:file,type:t};
  }
  throw{code:'unsupported_type'};
}
function uploadMsg(e){
  const c=e&&e.code;
  if(c==='unsupported_type')return tx('نوع الملف غير مدعوم. المقبول: صور (JPG أو PNG) وملفات PDF. ملفات Word وPowerPoint تُحفظ أولاً بصيغة PDF.','This file type is not supported. Use photos (JPG or PNG) or PDF. Save Word and PowerPoint files as PDF first.');
  if(c==='too_large')return tx('الملف أكبر من 20 ميغابايت.','The file is larger than 20 MB.');
  if(c==='quota_or_state')return tx('امتلأت مساحة التخزين في الدفتر.','The notebook’s storage is full.');
  if(c==='rate_limited')return tx('رفع كثير في وقت قصير. يمكن المحاولة بعد قليل.','Too many uploads at once. Try again in a moment.');
  if(c==='not_granted'||c==='capability_disabled')return tx('رفع الملفات غير متاح في هذا العرض.','Uploading is not available in this view.');
  if(c==='invalid_argument')return tx('لا تسمح صلاحية هذا الحساب بالحفظ في الدفتر.','This account cannot save to the notebook.');
  if(c==='quota_exceeded')return tx('امتلأت قاعدة بيانات الدفتر.','The notebook’s database is full.');
  return tx('تعذّر رفع الملف. يمكن المحاولة مرة أخرى.','The file could not be uploaded. Try again.');
}
async function uploadAll(files,status){
  const out=[];
  for(let i=0;i<files.length;i++){
    if(status)status(tx(`جارٍ رفع ${i+1} من ${files.length}…`,`Uploading ${i+1} of ${files.length}…`));
    const p=await prepFile(files[i]);
    const r=await S.assets.upload(p.blob,{type:p.type});
    out.push({id:r.id,type:r.contentType||p.type,name:String(files[i].name||'').slice(0,120)});
  }
  return out;
}
function extFor(type){return type==='application/pdf'?'pdf':type==='image/png'?'png':type==='image/webp'?'webp':type==='image/gif'?'gif':'jpg'}
async function download(id,name,type){
  if(!S.downloads)return;
  try{
    const r=await fetch(blobUrl(id));if(!r.ok)throw{code:'fetch'};
    const b=await r.blob();
    const base=String(name||'file').replace(/[\\/:*?"<>|]+/g,' ').trim().slice(0,80)||'file';
    await S.downloads.save({filename:base+'.'+extFor(type),data:b});
  }catch(e){if(!e||e.code!=='declined')toast(tx('تعذّر التنزيل.','The download did not work.'))}
}

const armed=new Map();

  armed.set(key,Date.now());el.textContent=tx('تأكيد الحذف','Confirm delete');el.classList.add('armed');

/* Every question carries a private tutor's help, so the student learns from a mistake instead of only seeing the answer. */
function helpRules(s,it){
  const pics=s.id==='math'?VIS_MATH:(s.id==='english'&&etype(it)==='phonics')?VIS_PHONICS:'';
  return `
Like a kind private tutor, every question also helps her when she gets it wrong. Add to each one:
- "hint": one short nudge that helps her think (where to look, what to remember), without giving the answer away.
- "why": one or two short sentences that explain the right answer, so she understands it and does not just memorise it.
- "wrong" (only on "choice" and "type"): an object whose keys are wrong answers and whose values say kindly why that answer is wrong. For "choice", give a key for every wrong option, copied exactly. For "type", give one or two likely mistakes (a common misspelling or slip).`+
  (pics?`

  openModal(`<div class="busy"><div class="spinner" aria-hidden="true"></div><h2>${esc(msg)}</h2><p class="muted" id="bTime">${tx('يقرأ Claude الصور الآن. يستغرق هذا عادة أقل من دقيقة.','Claude is reading the photos. This usually takes less than a minute.')}</p><button class="btn" data-act="stop">${tx('إيقاف','Stop')}</button></div>`);
  clearInterval(busyTimer);busyTimer=setInterval(()=>{const el=$('#bTime');if(el)el.textContent=tx('يقرأ Claude الصور الآن… ','Claude is reading the photos… ')+Math.round((Date.now()-t0)/1000)+tx(' ث','s')},1000);
  return busyCtl;
}
function hideBusy(){clearInterval(busyTimer);busyCtl=null;closeModal()}
async function fetchImages(files){
  return Promise.all(files.map(f=>fetch(blobUrl(f.id)).then(r=>{if(!r.ok)throw{code:'fetch'};return r.blob()})));
}
/* Schools often send the weekly plan as a PDF. Its pages are drawn to images with pdf.js (loaded only when needed)
   so Claude can read them like photos. */
const isPdf=f=>String(f&&f.type||'')==='application/pdf'||/\.pdf$/i.test(String(f&&f.name||''));
const isImg=f=>String(f&&f.type||'').startsWith('image/');
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsP=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(!pdfjsP)pdfjsP=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';
    s.onload=()=>{const L=window.pdfjsLib;if(!L){pdfjsP=null;rej({code:'pdf'});return}L.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';res(L)};
    s.onerror=()=>{pdfjsP=null;rej({code:'pdf'})};
    document.head.appendChild(s);
  });
  return pdfjsP;
}
async function pdfToImages(blob,max){
  try{
    const L=await loadPdfJs();
    const doc=await L.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
    const out=[];
    for(let p=1;p<=Math.min(doc.numPages,max);p++){
      const page=await doc.getPage(p),vp=page.getViewport({scale:1.6});
      const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
      await page.render({canvasContext:g,viewport:vp}).promise;
      out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)));
    }
    return out.filter(Boolean);
  }catch(e){throw e&&e.code?e:{code:'pdf'}}
}
/* Photos as they are, and each PDF as page images, up to the image limit. */
async function planImages(files){
  const max=S.sampleMax||5;
  let blobs=await fetchImages(files.filter(isImg).slice(0,max));
  for(const f of files.filter(isPdf)){
    if(blobs.length>=max)break;
    const [pdf]=await fetchImages([f]);
    blobs=blobs.concat(await pdfToImages(pdf,max-blobs.length));
  }
  return blobs;
}
function setBusy(m){const h=md.querySelector('.busy h2');if(h)h.textContent=m}
const PROMPTS={outline:outlinePrompt,sheet:sheetPrompt,game:gamePrompt,grammar:grammarPrompt,phonics:phonicsPrompt,visual:visualPrompt};
const NORMS={reading:normalizeReading,outline:normalizeOutline,sheet:normalizeSheet,game:normalizeGame,grammar:normalizeGrammar,phonics:normalizePhonics,visual:normalizeVisual};
async function runMake(s,ctx,imgs,whats,extra,replace){
  if(!S.sample||!S.db)return;
  imgs=imgs.slice(0,S.sampleMax);
  if(!imgs.length){toast(tx('لا توجد صور لهذا الدرس.','This lesson has no photos.'));return}
  const ctl=showBusy(tx('تجهيز ','Preparing ')+kindName(whats[0]));const made=[];
  const names=()=>made.map(m=>kindName(m.kind)).join(tx('، ',', '));
  try{
    const blobs=await fetchImages(imgs);
    for(let k=0;k<whats.length;k++){
      const what=whats[k];
      setBusy(tx('تجهيز ','Preparing ')+kindName(what)+(whats.length>1?tx(` (${k+1} من ${whats.length})`,` (${k+1} of ${whats.length})`):''));
      const data=what==='reading'?await makeReadingData(ctx,blobs,ctl.signal)
        :NORMS[what](await S.sample.json(PROMPTS[what](s,ctx,blobs.length),{images:blobs,signal:ctl.signal,cache:false}));
      if(!data)throw{code:'bad_shape'};
      const doc=Object.assign({kind:what,subject:s.id},data,extra,{createdAt:nowIso()});
      const ref=await S.db.collection('items').add(doc);
      made.push(Object.assign({id:ref.id},doc));
      if(replace&&replace[what])for(const old of replace[what])await dropGenerated(old);
    }
    hideBusy();
    if(made.length===1)openItem(made[0]);else toast(tx('جاهز: ','Ready: ')+names());
  }catch(e){
    hideBusy();
    if(e&&e.code==='cancelled'){if(made.length)toast(tx('أُوقف التجهيز. جاهز: ','Stopped. Ready: ')+names());return}
    openModal(`<h2>${tx('لم يكتمل التجهيز','Preparation did not finish')}</h2><p>${esc((made.length?tx('جاهز: ','Ready: ')+names()+'. ':'')+sampleMsg(e))}</p><p class="hint">${tx('يمكن المحاولة مرة أخرى من الزر نفسه، أو إرسال صور الدرس إلى Claude في المحادثة.','Try again with the same button, or send the lesson photos to Claude in the chat.')}</p><div class="mactions"><button class="btn" type="button" data-act="mclose">${tx('حسناً','OK')}</button></div>`,true);
  }
}
/* Reading comes in two smaller calls: the text as plain lines (no JSON to break on a long passage), then the yellow words. */
function readingTextPrompt(ctx,n){
  return `The ${n} attached image(s) are photos of pages from an English lesson`+(ctx.title?` "${ctx.title}"${ctx.pages?` (book pages ${ctx.pages})`:''}`:'')+`, in page order. A computer voice will read your text aloud to an 8-year-old.
Retell the lesson in simple English for an 8-year-old learner, in your own words. For a story, keep its characters and events in order; for a grammar or phonics page, explain the rule simply with new examples. Use every word that is highlighted in yellow. Do not copy the book's sentences: write new, short sentences. Keep it to about 300 words in short paragraphs.
Reply in plain text only: the first line is "TITLE: " followed by the title of the passage or lesson, then each paragraph, with one empty line between paragraphs. Write nothing else.`;
}
function parseReadingText(t){
  t=String(t||'').replace(/```[a-z]*\n?/gi,'').replace(/\r/g,'').trim();
  let title='';const m=/^\s*TITLE:\s*(.*)$/im.exec(t);
  if(m){title=m[1].trim();t=t.replace(m[0],'')}
  const paragraphs=t.split(/\n\s*\n/).map(p=>p.replace(/\s*\n\s*/g,' ').trim()).filter(Boolean).slice(0,80).map(p=>p.slice(0,3000));
  return{title:title.slice(0,120),paragraphs};
}
function vocabPrompt(ctx,n,text){
  return `The ${n} attached image(s) are photos of pages from an English lesson for ${kidEn()}`+(ctx.title?` ("${ctx.title}")`:'')+`. The student is 8, in Grade 3, and their first language is Arabic. This is a simple retelling of the pages:
"""${text.slice(0,12000)}"""
Some words in the photos are highlighted in yellow. These are her vocabulary words. List every yellow-highlighted word, in the order they appear.
For each word give: "w" (the word as highlighted), "base" (its dictionary form), "pos" (noun, verb, adjective, adverb...), "meaning" (a very simple English meaning for an 8-year-old, at most 12 words), "ar" (its Arabic meaning in 1 to 3 words), "from" (one short sentence in your own words saying how the word is used in the lesson), and "examples" (2 new short sentences about a child's everyday life that show the meaning clearly).
If no words are highlighted in yellow, choose up to 6 words from the pages that a Grade 3 learner may not know, and set "highlighted" to false.
Reply with only JSON: {"highlighted":true,"vocab":[{"w":"...","base":"...","pos":"...","meaning":"...","ar":"...","from":"...","examples":["...","..."]}]}`;
}
async function makeReadingData(ctx,blobs,signal){
  const r=await S.sample(readingTextPrompt(ctx,blobs.length),{images:blobs,signal,cache:false});
  const parsed=parseReadingText(r&&r.text);
  if(!parsed.paragraphs.length)throw{code:'bad_shape'};
  setBusy(tx('تجهيز الكلمات الصفراء','Preparing the yellow words'));
  let vocab=[],highlighted=true;
  try{
    const v=await S.sample.json(vocabPrompt(ctx,blobs.length,parsed.paragraphs.join('\n\n')),{images:blobs,signal,cache:false});
    const n=normalizeReading({paragraphs:['x'],vocab:v&&v.vocab,highlighted:v&&v.highlighted});
    if(n){vocab=n.vocab;highlighted=n.highlighted}
  }catch(e){if(e&&e.code==='cancelled')throw e}
  return{title:parsed.title||str(ctx.title)||'Reading',lang:'en',highlighted,paragraphs:parsed.paragraphs,vocab};
}
function makeFromPhoto(id,what){
  const it=S.items.find(x=>x.id===id);if(!it)return;
  const s=SUBJ[it.subject];if(!s)return;
  const l=it.lesson&&S.lessons.find(x=>x.id===it.lesson);
  const ctx=l?{title:l.title,pages:l.pages,note:it.note,etype:etype(l)}:{title:it.title,note:it.note};
  const extra={source:id};if(it.lesson)extra.lesson=it.lesson;
  runMake(s,ctx,imagesOf(it),[what],extra);
}
function makeForLesson(lid,whats,imgs,opts){
  const l=S.lessons.find(x=>x.id===lid);if(!l)return;
  const s=SUBJ[l.subject];if(!s)return;
  let replace=null;
  if(opts&&opts.replace){replace={};whats.forEach(k=>{replace[k]=lessonItems(lid,k).map(i=>i.id)})}
  const d=dictOf(l);
  runMake(s,{title:l.title,pages:l.pages,etype:etype(l),words:d&&d.lang==='en'?d.words.join(', '):''},imgs||lessonImages(lid),whats,{lesson:lid},replace);
}
/* True when photos were added after the lesson's reading/map/sheet/game were made. */
function lessonStale(l){
  const photos=lessonItems(l.id,'photo');if(!photos.length)return false;
  const made=kindsFor(l).map(k=>lessonItems(l.id,k)[0]).filter(Boolean);if(!made.length)return false;
  const newest=photos.reduce((m,p)=>String(p.createdAt||'')>m?String(p.createdAt||''):m,'');
  const oldest=made.reduce((m,i)=>!m||String(i.createdAt||'')<m?String(i.createdAt||''):m,'');
  return newest>oldest;
}
async function dropGenerated(id){
  try{await S.db.doc('items/'+id).delete()}catch(e){}
  if(S.results[id]){try{await S.db.doc('results/'+id).delete()}catch(e){}}

function openItem(it){
  if(!it)return;
  if(it.kind==='game')startGame(it);
  else if(it.kind==='sheet')showSheet(it);
  else if(it.kind==='outline')showOutline(it);
  else if(it.kind==='reading')showReading(it);

async function extractWeek(id,files){
  const w=S.weeks.find(x=>x.id===id);
  const list=(files||(w&&w.files)||[]).filter(f=>isImg(f)||isPdf(f));
  if(!list.length||!S.sample)return;
  const ctl=showBusy(tx('قراءة الخطة الأسبوعية','Reading the weekly plan'));
  try{
    const blobs=await planImages(list);
    if(!blobs.length)throw{code:'pdf'};
    const out=await S.sample.json(weekPrompt(blobs.length),{images:blobs,signal:ctl.signal,cache:false});
    if(!out||typeof out!=='object'||!out.notes)throw{code:'bad_shape'};
    const notes={};SUBJECTS.forEach(s=>{notes[s.id]=str(out.notes[s.id]).slice(0,500)});
    const upd={notes,reminders:(Array.isArray(out.reminders)?out.reminders:[]).map(str).filter(Boolean).slice(0,4)};
    if(str(out.title))upd.title=str(out.title).slice(0,80);
    await S.db.doc('weeks/'+id).update(upd);
    const wk=S.weeks.find(x=>x.id===id);
    const ls=out.lessons&&typeof out.lessons==='object'?out.lessons:{};
    if(!S.lessons.some(l=>l.week===id)){
      for(const s of SUBJECTS){
        const arr=(Array.isArray(ls[s.id])?ls[s.id]:[]).slice(0,12);
        for(let k=0;k<arr.length;k++){
          const x=arr[k]||{};const title=str(x.title).slice(0,160);if(!title)continue;
          await S.db.collection('lessons').add({week:id,weekOf:wk?wk.weekOf:'',subject:s.id,order:k+1,period:str(x.period).slice(0,40),title,
            pages:str(x.pages).slice(0,40),homework:str(x.homework).slice(0,300),assess:str(x.assess).slice(0,300),assessType:str(x.assessType).slice(0,20),
            etype:s.id==='english'&&ETYPES.includes(str(x.etype))?str(x.etype):''});
        }
      }
    }
    hideBusy();toast(tx('كُتب ما على كل مادة','Each subject is filled in'));
  }catch(e){hideBusy();if(!e||e.code!=='cancelled')toast(sampleMsg(e))}
}

/* ---------- game player ---------- */
let G=null;
function normAns(s){
  return String(s).toLowerCase().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[.,!?؟،؛;:"'()\[\]]/g,'').replace(/\s+/g,' ').trim();
}
/* Commas are part of the answer when the answer itself has them (comma practice), so they are kept for that check. */
function commaForm(s){return String(s).toLowerCase().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[ً-ْـ]/g,'').replace(/\s*([,،])\s*/g,'$1').replace(/[.!?؟"']/g,'').replace(/\s+/g,' ').trim()}
function answerOk(v,ans){
  const x=normAns(v);if(!x)return false;
  return String(ans).split('|').some(a=>/[,،]/.test(a)?commaForm(a)===commaForm(v):normAns(a)===x);
}
/* The kind reason for a wrong answer, if the question has one for it. */
function wrongWhy(q,v){
  if(!q.wrong)return '';
  if(q.wrong[v])return q.wrong[v];
  const x=normAns(v);const k=Object.keys(q.wrong).find(k=>/[,،]/.test(k)?commaForm(k)===commaForm(v):normAns(k)===x);return k?q.wrong[k]:'';
}
/* The tutor's box: a nudge, or the answer with its explanation and picture. */
function tutorBox(lang,o){
  const L=T[lang];let h='';
  if(o.reason)h+=`<p class="tline"><span class="tico" aria-hidden="true">💡</span><span dir="auto">${esc(o.reason)}</span>${spk(o.reason)}</p>`;
  if(o.answer!=null)h+=`<p class="tans">${esc(L.answer)}: <b dir="auto">${esc(o.answer)}</b></p>`;
  if(o.why)h+=`<p class="twhy"><b>${esc(L.why)}</b> <span dir="auto">${esc(o.why)}</span>${spk(o.why)}</p>`;
  if(o.pic)h+=`<div class="tpic">${renderCard(o.pic)}</div>`;
  return h?`<div class="tutor${o.answer!=null?' full':''}" dir="${lang==='ar'?'rtl':'ltr'}">${h}</div>`:'';
}
function shownAnswer(q,L){return q.type==='tf'?(q.answer?L.tru:L.fal):String(q.answer).split('|')[0]}
function startGame(it){
  const rounds=(Array.isArray(it.rounds)?it.rounds:[]).map(r=>normRound(r,true)).filter(Boolean);
  if(!rounds.length){toast(tx('هذه اللعبة فارغة.','This game is empty.'));return}
  const total=rounds.reduce((t,r)=>t+(r.type==='match'?r.pairs.length:1),0);
  G={it,rounds,i:0,score:0,total,lang:langOf(it),cur:null,missed:[],review:false,fixed:0};
  drawRound();
}
function point(){if(!G.review)G.score++}
function playerShell(inner){
  const L=T[G.lang];const pct=Math.round((G.i/G.rounds.length)*100);
  return `<div class="ov-in s-${esc(G.it.subject)}${G.review?' review':''}" dir="${G.lang==='ar'?'rtl':'ltr'}" lang="${G.lang}">
    <div class="ptop"><button class="btn small" data-act="close">${L.close}</button><div class="pbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div><span class="pcount">${Math.min(G.i+1,G.rounds.length)} / ${G.rounds.length}</span></div>
    <p class="ptitle" dir="auto">${G.review?`<span class="fixtag">${esc(L.fixRound)}</span> `:''}${esc(G.it.title)}</p>${inner}</div>`;
}
function drawRound(){
  const L=T[G.lang];const r=G.rounds[G.i];let body='';
  G.cur={r,done:false,tries:0};
  if(r.type==='choice'){
    G.cur.choices=shuffle(r.choices);
    body=`<p class="q" dir="auto">${esc(r.q)}</p><div class="choices">${G.cur.choices.map((c,k)=>`<button class="choice" data-act="pick" data-k="${k}" dir="auto">${esc(c)}</button>`).join('')}</div>`;
  }else if(r.type==='tf'){
    G.cur.choices=[true,false];
    body=`<p class="q" dir="auto">${esc(r.q)}</p><div class="choices tf"><button class="choice" data-act="pick" data-k="0">${L.tru}</button><button class="choice" data-act="pick" data-k="1">${L.fal}</button></div>`;
  }else if(r.type==='listen'){
    body=`<p class="q" dir="auto">${esc(r.q||'Listen and write the word')}</p><div class="listen-wrap"><button class="spk big" type="button" data-act="say" data-text="${esc(r.answer.split('|')[0])}" aria-label="Listen again">${ICON.speaker}</button></div><form class="typeform" id="ptype"><input class="pinput" id="pin" autocomplete="off" autocapitalize="off" spellcheck="false" dir="auto" aria-label="${L.type}" placeholder="${L.type}"><button class="btn big color" type="submit">${L.check}</button></form>`;
  }else if(r.type==='type'){
    body=`<p class="q" dir="auto">${esc(r.q)}</p><form class="typeform" id="ptype"><input class="pinput" id="pin" autocomplete="off" autocapitalize="off" spellcheck="false" dir="auto" aria-label="${L.type}" placeholder="${L.type}"><button class="btn big color" type="submit">${L.check}</button></form>`;
  }else{
    G.cur.right=shuffle(r.pairs.map((p,k)=>k));G.cur.sel=null;G.cur.matched=new Set();G.cur.missed=new Set();
    body=`<p class="q" dir="auto">${esc(r.q||L.match)}</p><p class="muted" style="text-align:center;margin:-10px 0 16px">${L.pickLeft}</p>
      <div class="match"><div class="mcol">${r.pairs.map((p,k)=>`<button class="mitem" data-act="mleft" data-k="${k}" dir="auto">${esc(p[0])}</button>`).join('')}</div>
      <div class="mcol">${G.cur.right.map(k=>`<button class="mitem" data-act="mright" data-k="${k}" dir="auto">${esc(r.pairs[k][1])}</button>`).join('')}</div></div>`;
  }
  openOverlay(playerShell(`<div class="round">${body}</div><div class="pfeed" id="pfeed" aria-live="polite"></div><div class="pnext"><button class="btn big primary" id="pnext" data-act="pnext" hidden>${G.i===G.rounds.length-1?L.finish:L.next}</button></div>`));
  if(r.type==='listen')speak(r.answer.split('|')[0]);
  if(r.type==='type'||r.type==='listen')setTimeout(()=>{const i=$('#pin');if(i)try{i.focus()}catch(e){}},40);
}
/* A round ends: praise or the explanation. A round she did not get right first time comes back in the fix-it round. */
function feed(ok,box){
  const L=T[G.lang];const f=$('#pfeed');const c=G.cur;
  const clean=ok&&!c.tries&&!(c.missed&&c.missed.size);
  if(G.review){if(clean)G.fixed++}else if(!clean)G.missed.push(c.r);
  f.className='pfeed '+(ok?'ok':'bad');
  f.innerHTML=(ok?esc(praise(G.lang)):esc(L.wrong))+(box||'');
  c.done=true;const n=$('#pnext');n.hidden=false;setTimeout(()=>{try{n.focus()}catch(e){}},30);
}
/* A first slip: a nudge and one more try, with no answer shown yet. */
function nudge(reason){
  const L=T[G.lang];const f=$('#pfeed');
  f.className='pfeed bad';
  f.innerHTML=esc(L.thinkAgain)+tutorBox(G.lang,{reason:reason||L.again});
}
function explainBox(r,reason){return tutorBox(G.lang,{reason,answer:shownAnswer(r,T[G.lang]),why:r.why,pic:r.pic})}
function pick(k){
  if(!G||G.cur.done)return;const c=G.cur,r=c.r;
  const val=c.choices[k];const ok=val===r.answer;
  const btns=[...ov.querySelectorAll('.choice')];
  if(!ok&&r.type==='choice'&&!c.tries&&btns.length>2){
    c.tries=1;const b=btns[+k];if(b){b.disabled=true;b.classList.add('bad')}
    nudge(wrongWhy(r,val)||r.hint);return;
  }
  btns.forEach((b,j)=>{b.disabled=true;const right=c.choices[j]===r.answer;if(right)b.classList.add('ok');else if(j===+k)b.classList.add('bad');else if(!b.classList.contains('bad'))b.classList.add('dim')});
  if(ok){if(!c.tries)point();feed(true,c.tries&&r.why?tutorBox(G.lang,{why:r.why,pic:r.pic}):'');return}
  feed(false,explainBox(r,r.type==='choice'?wrongWhy(r,val):''));
}
function checkType(){
  if(!G||G.cur.done)return;const c=G.cur,r=c.r;const inp=$('#pin');const v=inp.value;
  if(!v.trim())return;
  if(answerOk(v,r.answer)){if(!c.tries)point();inp.disabled=true;feed(true,c.tries?tutorBox(G.lang,{answer:shownAnswer(r,T[G.lang]),why:r.why,pic:r.pic}):'');return}
  c.tries++;
  if(c.tries<2){nudge(wrongWhy(r,v)||r.hint);inp.select();return}
  inp.disabled=true;feed(false,explainBox(r,wrongWhy(r,v)));
}
function mLeft(k){
  if(!G||G.cur.done||G.cur.matched.has(+k))return;G.cur.sel=+k;
  ov.querySelectorAll('[data-act=mleft]').forEach(b=>b.classList.toggle('sel',+b.dataset.k===+k));
}
function mRight(el,k){
  if(!G||G.cur.done)return;const c=G.cur;k=+k;if(c.matched.has(k)&&el.disabled)return;
  if(c.sel==null){const f=$('#pfeed');f.className='pfeed';f.textContent=T[G.lang].pickLeft;return}
  const r=c.r;const leftBtn=ov.querySelector(`[data-act=mleft][data-k="${c.sel}"]`);

function dictOf(l){
  if(!l)return null;
  const as=str(l.assess);if(!as)return null;
  if(!(str(l.assessType)==='إملاء'||/إملاء|dictation/i.test(as)))return null;
  if(/[؀-ۿ]/.test(as.replace(/^\s*إملاء\s*:?/,''))){
    const sentence=as.replace(/^\s*إملاء\s*:?\s*/,'').trim();
    const words=sentence.replace(/[.,،؟?!؛:()«»"]/g,' ').split(/\s+/).filter(Boolean);
    return words.length?{lang:'ar',sentence,words}:null;
  }
  const words=[...new Set(as.replace(/^\s*dictation\s*(words)?\s*:?/i,'').split(/[,،;\/\n]+|\s+/).map(w=>w.trim().replace(/[^A-Za-z'’-]/g,'')).filter(w=>w.length>1))];
  return words.length?{lang:'en',words}:null;
}
/* Common English silent-letter patterns: wr-, kn-, gn-, -gn, -mb, -igh-, -alk, -stle/-sten, h- in hour/honest. */
function silentIdx(w){
  const s=String(w).toLowerCase(),idx=new Set();let m;
  if(/^(wr|kn|gn)/.test(s))idx.add(0);
  if((m=/gn(s|ed|ing)?$/.exec(s))&&m.index>0)idx.add(m.index);
  if((m=/mb(s|ed|ing)?$/.exec(s)))idx.add(m.index+1);
  for(let i=s.indexOf('igh');i>=0;i=s.indexOf('igh',i+3)){idx.add(i+1);idx.add(i+2)}
  if((m=/alk/.exec(s)))idx.add(m.index+1);
  if((m=/st(le|en)/.exec(s)))idx.add(m.index+1);
  if(/^(hour|honest|honou?r|heir)/.test(s))idx.add(0);
  return [...idx].sort((a,b)=>a-b);
}

  const g=silentIdx(w);if(!g.length)return '';

}

function arChoices(w){
  const p=plainAr(w);const tan=(w.match(/[ً-ٍ]/)||[''])[0];
  const withTan=x=>tan?x+tan:x;const correct=withTan(p);const wr=new Set();
  if(tan)wr.add(p+'ن');
  const sun=/^((?:و|ف|ب|ك)?)ال([تثدذرزسشصضطظلن])/.exec(p);
  if(sun)wr.add(withTan(p.replace(/^((?:و|ف|ب|ك)?)ال/,'$1ا')));
  const sh=w.indexOf('ّ');
  if(sh>0&&!sun){let k=-1;for(let i=0;i<sh;i++)if(!/[ً-ْـ]/.test(w[i]))k++;if(k>=0)wr.add(withTan(p.slice(0,k+1)+p[k]+p.slice(k+1)))}
  if(/ة$/.test(p)){wr.add(withTan(p.slice(0,-1)+'ه'));wr.add(withTan(p.slice(0,-1)+'ت'))}
  if(/ى$/.test(p))wr.add(withTan(p.slice(0,-1)+'ا'));
  if(/[أإ]/.test(p))wr.add(withTan(p.replace(/[أإ]/g,'ا')));
  wr.delete(correct);
  return{correct,wrongs:[...wr].slice(0,2)};
}

function dMode(mode){
